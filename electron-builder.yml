# Desktop builds run in GitHub Actions (.github/workflows/desktop.yml).
appId: com.jstdlee.aicanvas
productName: AI Canvas
copyright: Copyright © 2026 jstdlee
directories:
  output: release
  buildResources: build
# Everything is bundled: dist/ (web app) and dist-electron/ (main + server).
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
  - "!**/*.map"
asar: true
artifactName: ai-canvas-${version}-${os}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  icon: build/icon.png
  synopsis: Offline canvas for drawing and AI workflows
  maintainer: jstdlee <302753485+jstdlee@users.noreply.github.com>

win:
  target:
    - nsis
    - portable
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ai-canvas-${version}-windows-${arch}-setup.${ext}

portable:
  artifactName: ai-canvas-${version}-windows-${arch}-portable.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
  icon: build/icon.png
  identity: null

publish: null
